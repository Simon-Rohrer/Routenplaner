<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Logistikplaner zur Berechnung von Fahrtrouten, Entfernung und Fahrzeit.">
    <title>Routenplaner - Logistikplaner</title>

    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">
    <link rel="stylesheet" href="css/routenplaner.css">
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <div class="brand-block">
                <div class="brand-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false">
                        <path d="M4 7.5A3.5 3.5 0 0 1 7.5 4h1.25a3.5 3.5 0 0 1 3.5 3.5v9a3.5 3.5 0 0 0 3.5 3.5h.75A3.5 3.5 0 0 0 20 16.5v-.25"/>
                        <path d="M4 7.5A3.5 3.5 0 0 0 7.5 11h9A3.5 3.5 0 0 1 20 14.5v1.75"/>
                        <circle cx="7.5" cy="7.5" r="2.25"/>
                        <circle cx="17.75" cy="16.25" r="2.25"/>
                    </svg>
                </div>
                <div>
                    <p class="eyebrow">Logistikplaner</p>
                    <h1>Routenplaner</h1>
                </div>
            </div>
            <div class="service-pill">
                <span class="status-dot" aria-hidden="true"></span>
                Nominatim und OSRM
            </div>
        </header>

        <main class="layout-grid">
            <section class="panel planner-panel" aria-labelledby="planner-title">
                <div class="panel-header">
                    <div>
                        <p class="eyebrow">Planung</p>
                        <h2 id="planner-title">Route berechnen</h2>
                    </div>
                    <svg class="panel-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M3 6.5h6l6 11h6"/>
                        <path d="M3 17.5h6l6-11h6"/>
                        <circle cx="4.5" cy="6.5" r="1.5"/>
                        <circle cx="19.5" cy="17.5" r="1.5"/>
                    </svg>
                </div>

                <form id="route-form" novalidate>
                    <div class="form-group">
                        <label for="start">Start-Adresse</label>
                        <div class="autocomplete-wrapper">
                            <input type="text" id="start" name="start" placeholder="z.B. Berlin, Deutschland" autocomplete="off" spellcheck="false">
                            <ul id="start-suggestions" class="autocomplete-suggestions" aria-label="Start-Vorschläge"></ul>
                        </div>
                        <small id="start-error" class="field-error"></small>
                    </div>

                    <div class="form-group">
                        <label for="ziel">Ziel-Adresse</label>
                        <div class="autocomplete-wrapper">
                            <input type="text" id="ziel" name="ziel" placeholder="z.B. München, Deutschland" autocomplete="off" spellcheck="false">
                            <ul id="ziel-suggestions" class="autocomplete-suggestions" aria-label="Ziel-Vorschläge"></ul>
                        </div>
                        <small id="ziel-error" class="field-error"></small>
                    </div>

                    <p id="route-error" class="form-message" role="alert"></p>

                    <div class="button-row">
                        <button id="calculate-btn" type="submit" class="button button-primary">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="M5 12h14"/>
                                <path d="m13 6 6 6-6 6"/>
                            </svg>
                            <span>Route berechnen</span>
                        </button>
                        <button id="clear-btn" type="button" class="button button-secondary">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="M4 7h16"/>
                                <path d="M10 11v6"/>
                                <path d="M14 11v6"/>
                                <path d="M6 7l1 14h10l1-14"/>
                                <path d="M9 7V4h6v3"/>
                            </svg>
                            <span>Löschen</span>
                        </button>
                    </div>
                </form>
            </section>

            <section id="results-section" class="metrics-grid" aria-label="Routendaten" hidden>
                <article class="metric-card metric-card-primary">
                    <div class="metric-label">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M4 19V5"/>
                            <path d="M20 19V5"/>
                            <path d="M8 8h8"/>
                            <path d="M8 16h8"/>
                            <path d="M7 5h10"/>
                            <path d="M7 19h10"/>
                        </svg>
                        Entfernung
                    </div>
                    <p class="metric-value"><span id="distance">-</span><small>km</small></p>
                </article>

                <article class="metric-card">
                    <div class="metric-label">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <circle cx="12" cy="12" r="8"/>
                            <path d="M12 8v5l3 2"/>
                        </svg>
                        Fahrzeit
                    </div>
                    <p id="duration" class="metric-value metric-value-small">-</p>
                    <p id="route-info" class="metric-note"></p>
                </article>
            </section>

            <section class="map-panel" aria-label="Karte">
                <div id="map"></div>
            </section>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <script src="js/routenplaner.js"></script>
</body>
</html>
